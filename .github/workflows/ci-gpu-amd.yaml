name: ci-gpu-AMD

on:
  issue_comment:
    types: [created]

jobs:
  excl-cousteau-mi100:
    if: |
      github.repository_owner == 'MAIQMag' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'Test this please')

    runs-on: [self-hosted, Linux, X64, ornl-excl-cousteau]

    env:
      GH_JOBNAME: ${{matrix.jobname}}
      GH_OS: Linux
      JULIA_DEPOT_PATH: /home/svh/.julia-cousteau
      SUNNY_TEST_GPU: AMDGPU
    strategy:
      fail-fast: false
      matrix:
        jobname: [MI100-ROCM7-JULIA1_13_3]

    steps:
      # Only trigger CI for certain "actors" (those commenting the PR, not the PR originator)
      - name: Verify actor
        env:
          ACTOR_TOKEN: ${{secrets.TOKENIZER}}${{github.actor}}${{secrets.TOKENIZER}}
          SECRET_ACTORS: ${{secrets.CI_GPU_ACTORS}}
        if: contains(env.SECRET_ACTORS, env.ACTOR_TOKEN)
        id: check
        run: |
          echo "triggered=true" >> $GITHUB_OUTPUT

      # Request repo info, required since issue_comment doesn't point at PR commit, but main
      - name: GitHub API Request
        if: steps.check.outputs.triggered == 'true'
        id: request
        uses: octokit/request-action@v3.0.0
        with:
          route: ${{github.event.issue.pull_request.url}}
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Create a separate PR status pointing at GitHub Actions tab URL
      # just like any other third-party service
      - name: Create PR status
        if: steps.check.outputs.triggered == 'true'
        uses: guibranco/github-status-action-v2@v1.2.4
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: "ci-gpu-AMD ${{ matrix.jobname }}"
          state: "pending"
          sha: ${{fromJson(steps.request.outputs.data).head.sha}}
          target_url: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}

      - name: Get PR information
        if: steps.check.outputs.triggered == 'true'
        id: pr_data
        run: |
          echo "branch=${{ fromJson(steps.request.outputs.data).head.ref }}" >> $GITHUB_OUTPUT
          echo "repo_name=${{ fromJson(steps.request.outputs.data).head.repo.full_name }}" >> $GITHUB_OUTPUT
          echo "repo_clone_url=${{ fromJson(steps.request.outputs.data).head.repo.clone_url }}" >> $GITHUB_OUTPUT
          echo "repo_ssh_url=${{ fromJson(steps.request.outputs.data).head.repo.ssh_url }}" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        if: steps.check.outputs.triggered == 'true'
        uses: actions/checkout@v7
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          repository: ${{fromJson(steps.request.outputs.data).head.repo.full_name}}
          ref: ${{steps.pr_data.outputs.branch}}

      - name: Setup Julia
        if: steps.check.outputs.triggered == 'true'
        run: |
          printenv
          julia --version
          julia --project -e 'using Pkg; Pkg.instantiate()'
          # AMDGPU is a GPU backend for GPU testitems, so add it to the test
          # environment only
          julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.add("AMDGPU")'
          julia --project=test -e 'using AMDGPU; AMDGPU.versioninfo()'

      - name: Cache Julia
        if: steps.check.outputs.triggered == 'true'
        uses: julia-actions/cache@v3
        with:
          depot: ${{ env.JULIA_DEPOT_PATH }}

      - name: Test
        if: steps.check.outputs.triggered == 'true'
        uses: julia-actions/julia-runtest@v1

      - name: Process Coverage
        if: steps.check.outputs.triggered == 'true'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext/KAExt

      - name: Upload Coverage
        if: steps.check.outputs.triggered == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
          override_commit: ${{fromJson(steps.request.outputs.data).head.sha}}
          override_branch: ${{steps.pr_data.outputs.branch}}
          override_pr: ${{github.event.issue.number}}
          flags: amdgpu

      - name: Report PR status
        if: always() && steps.check.outputs.triggered == 'true'
        uses: guibranco/github-status-action-v2@v1.2.4
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: "ci-gpu-AMD ${{matrix.jobname}}"
          state: ${{job.status}}
          sha: ${{fromJson(steps.request.outputs.data).head.sha}}
          target_url: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}
